# Recipe: Hy3-GPTQ
# Hy3 model with NVFP4 quantization

recipe_version: "1"
name: Hy3-GPTQ
description: vLLM serving Hy3-GPTQ on a multi-node cluster

# HuggingFace model to download (optional, for --download-model)
model: AngelSlim/Hy3-GPTQ-Int4

# Container image to use
container: vllm-node-custom

# Can only be run in a cluster
cluster_only: true

# No mods required
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_num_batched_tokens: 4096
  max_num_seqs: 8

# Environment variables
env:
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

# The vLLM serve command template
command: |
  vllm serve AngelSlim/Hy3-GPTQ-Int4 \
      --served-model-name hy3 \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend ray \
      --max-model-len auto \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --load-format auto \
      --kv-cache-dtype fp8 \
      --enable-auto-tool-choice \
      --tool-call-parser hy_v3  \
      --reasoning-parser hy_v3 \
      --speculative-config '{{"method":"dspark", "model":"AngelSlim/Hy3-DFly-Block8-Think-High", "num_speculative_tokens":7}}'
