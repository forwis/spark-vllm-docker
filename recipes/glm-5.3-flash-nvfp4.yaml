# Recipe: GLM-5.3-Flash-NVFP4 on two DGX Spark nodes.
# References:
# https://forums.developer.nvidia.com/t/glm-5-3-flash-on-2x-nvidia-dgx-spark-dflash2-60-tok-s-peak-checkpoint/381429
# https://forums.developer.nvidia.com/t/glm-5-3-flash-nvfp4-on-2x-dgx-spark-vllm-tp-2-docker-compose/381541
# Before every launch, reclaim filesystem caches on both hosts using an
# operator-approved host procedure. The GB10 driver needs genuinely free pages
# for the KV slab. This recipe intentionally does not run privileged host
# cache-clearing commands.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4 (TP=2)
description: Multimodal GB10 TP2 profile with FP8 KV cache and native MTP

model: LibertAIDAI/GLM-5.3-Flash-NVFP4
container: vllm-node-glm
cluster_only: true

env:
  TZ: Asia/Seoul
  # Required by the validated TP2 GB10/RoCE profile.  In particular, async
  # handling keeps PyTorch's NCCL watchdog from terminating a local worker
  # without surfacing the underlying fabric error.
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_MERGE_NICS: "0"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  GLM53_MIXED_PREFILL_CHUNK: skip

build_args:
  - --glm53-gb10

defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.89
  max_model_len: 200000
  max_num_seqs: 5
  max_num_batched_tokens: 2048
  block_size: 2304
  num_speculative_tokens: 5

command: |
  glm53_model_snapshot="$(cat /root/.cache/huggingface/hub/models--LibertAIDAI--GLM-5.3-Flash-NVFP4/refs/main)"
  vllm serve "/root/.cache/huggingface/hub/models--LibertAIDAI--GLM-5.3-Flash-NVFP4/snapshots/$glm53_model_snapshot" \
    --served-model-name glm-5.3-flash \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size {block_size} \
    --moe-backend marlin \
    --load-format instanttensor \
    --kv-cache-dtype fp8_e4m3 \
    --enforce-eager \
    --limit-mm-per-prompt '{{"image":8,"video":1}}' \
    --mm-processor-cache-type lru \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --enable-auto-tool-choice \
    --tool-call-parser glm47 \
    --reasoning-parser glm45
