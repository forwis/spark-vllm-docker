# Recipe: GLM-5.3-Flash-NVFP4 on two DGX Spark nodes.
# References:
# https://github.com/tonyd2wild/GLM-5.3-Flash-NVFP4-DFlash2-2x-DGX-Spark
# https://github.com/vllm-project/vllm/issues/54150
# Replace any earlier vllm-node-glm image on both nodes before launch:
# ./build-and-copy.sh --glm53-gb10 -c --copy-parallel
# Download both models to every node before launch:
# ./hf-download.sh RedHatAI/GLM-5.3-Flash-NVFP4 -c --copy-parallel
# ./hf-download.sh incoai/GLM-5.3-Flash-DFlash2 -c --copy-parallel
# Before every launch, reclaim filesystem caches on both hosts using an
# operator-approved host procedure. The GB10 driver needs genuinely free pages
# for the KV slab. This recipe intentionally does not run privileged host
# cache-clearing commands.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4 (TP=2)
description: Qualified GB10 TP2 profile with FP8 KV cache and DFlash2

model: RedHatAI/GLM-5.3-Flash-NVFP4
container: vllm-node-glm
cluster_only: true

env:
  TZ: Asia/Seoul
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  # Required by the validated TP2 GB10/RoCE profile.  In particular, async
  # handling keeps PyTorch's NCCL watchdog from terminating a local worker
  # without surfacing the underlying fabric error.
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_MERGE_NICS: "0"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"

build_args:
  - --glm53-gb10

defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  block_size: 2304
  num_speculative_tokens: 7

command: |
  glm53_model_snapshot="$(cat /root/.cache/huggingface/hub/models--RedHatAI--GLM-5.3-Flash-NVFP4/refs/main)"
  glm53_draft_snapshot="$(cat /root/.cache/huggingface/hub/models--incoai--GLM-5.3-Flash-DFlash2/refs/main)"
  vllm serve "/root/.cache/huggingface/hub/models--RedHatAI--GLM-5.3-Flash-NVFP4/snapshots/$glm53_model_snapshot" \
    --served-model-name glm-5.3-flash \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size {block_size} \
    --moe-backend marlin \
    --kv-cache-dtype fp8_e4m3 \
    --enforce-eager \
    --speculative-config '{{"method":"dflash","model":"/root/.cache/huggingface/hub/models--incoai--GLM-5.3-Flash-DFlash2/snapshots/'"$glm53_draft_snapshot"'","num_speculative_tokens":{num_speculative_tokens}}}' \
    --default-chat-template-kwargs '{{"enable_thinking":false}}' \
    --chat-template /opt/spark-vllm/glm53/chat_template_mm.jinja \
    --enable-auto-tool-choice \
    --tool-call-parser glm47 \
    --reasoning-parser glm45
