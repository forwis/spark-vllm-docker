# Recipe: GLM-5.3-Flash-NVFP4 on two DGX Spark nodes.
# Native FP8 DS-MLA patch source: /home/arbusto/git/glm53-flash-cluster
# Replace any earlier vllm-node-glm image on both nodes before launch:
# ./build-and-copy.sh --glm53-gb10 -c --copy-parallel
# Download only this model to every node before launch:
# ./hf-download.sh LibertAIDAI/GLM-5.3-Flash-NVFP4 -c --copy-parallel
# Before every launch, reclaim filesystem caches on both hosts using an
# operator-approved host procedure. The GB10 driver needs genuinely free pages
# for the KV slab. This recipe intentionally does not run privileged host
# cache-clearing commands.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4 native FP8 DS-MLA (TP=2)
description: Qualified GB10 TP2 profile using native FP8 DS-MLA with the vendored NoPE patch chain

model: LibertAIDAI/GLM-5.3-Flash-NVFP4
container: vllm-node-glm
cluster_only: true

env:
  TZ: Asia/Seoul
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_MLA_NOPE_PAD_ROPE: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_MERGE_NICS: "0"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"

build_args:
  - --glm53-gb10

defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_num_seqs: 2
  max_num_batched_tokens: 1024
  block_size: 256

command: |
  glm53_model_cache=/root/.cache/huggingface/hub/models--LibertAIDAI--GLM-5.3-Flash-NVFP4
  glm53_model_ref="$glm53_model_cache/refs/main"
  if [ ! -r "$glm53_model_ref" ]; then
    echo "Error: GLM-5.3 snapshot ref is missing: $glm53_model_ref" >&2
    exit 1
  fi
  glm53_model_snapshot="$(cat "$glm53_model_ref")"
  glm53_model_path="$glm53_model_cache/snapshots/$glm53_model_snapshot"
  if [ ! -f "$glm53_model_path/processor_config.json" ]; then
    echo "Error: GLM-5.3 snapshot is incomplete: missing processor_config.json in $glm53_model_path" >&2
    exit 1
  fi
  vllm serve "$glm53_model_path" \
    --served-model-name glm-5.3-flash \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len 65536 \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size {block_size} \
    --moe-backend flashinfer_cutlass \
    --enforce-eager \
    --enable-auto-tool-choice \
    --tool-call-parser glm47 \
    --reasoning-parser deepseek_r1 \
    --kv-cache-dtype fp8_ds_mla \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}'
