# Recipe: Qwen3.8-Flash-Next-NVFP4 on two DGX Spark nodes.
# References:
# This is a hardened native-context profile, not a production qualification.
# A distinct experimental recipe carries the 1M YaRN override.
# https://github.com/vllm-project/vllm/issues/54629
# https://forums.developer.nvidia.com/t/381836
# Before launch, reclaim filesystem caches on every host using an
# operator-approved host procedure. This recipe intentionally does not run
# privileged host cache-clearing commands.

recipe_version: "1"
name: Qwen3.8-Flash-Next-NVFP4 hardened native context (TP=2)
description: Hardened native-262K GB10 TP2 profile; soak testing is still required before production

model: Inferact/Qwen3.8-Flash-Next-NVFP4
container: vllm-node-qwen
cluster_only: true

mods:
  - mods/qwen38-flash-next-stability


build_args:
  - --qwen38-flash-next

defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 2
  max_num_batched_tokens: 2048

command: |
  vllm serve Inferact/Qwen3.8-Flash-Next-NVFP4 \
    --served-model-name qwen3.8-flash-next \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --mamba-block-size 1024 \
    --enforce-eager \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --load-format instanttensor \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}' \
    --max-model-len {max_model_len}
