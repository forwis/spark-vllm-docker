# Recipe: Motif-3-NVFP4
# Step 3.7 Flash model with NVFP4 quantization (2+ sparks only)

recipe_version: "1"
name: Motif-3-NVFP4
description: vLLM serving Motif-3-NVFP4 on two Sparks

# HuggingFace model to download (optional, for --download-model)
model: Motif-Technologies/Motif-3-NVFP4

# Container image to use
container: vllm-node-motif

# Can only be run in a cluster
cluster_only: true

# No mods required
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve Motif-Technologies/Motif-3-NVFP4 \
      --served-model-name motif-3 \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend ray \
      --max-model-len auto \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --quantization modelopt_nvfp4 \
      --speculative-config '{{"model": "Motif-Technologies/Motif-3-NVFP4", "num_speculative_tokens": 1}}' \
      --enable-expert-parallel \
      --enable-auto-tool-choice \
      --tool-call-parser motif \
      --reasoning-parser motif \
      --dtype bfloat16 \
      --block-size 128
