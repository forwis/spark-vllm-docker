# Experimental 1M-context Qwen3.8 Flash Next canary on two DGX Spark nodes.
# This profile is intentionally separate from the native-context default.
# High-context deep prefill can still wedge a GB10 GPU even with prefix caching
# and MTP disabled; neither startup nor one bounded request qualifies service
# stability. See https://github.com/vllm-project/vllm/issues/54629 and the
# withdrawn NVIDIA forum report at https://forums.developer.nvidia.com/t/381836.

recipe_version: "1"
name: Qwen3.8-Flash-Next-NVFP4 1M experimental canary (TP=2)
description: Experimental 1M YaRN canary for isolated soak testing; not production qualified

model: Inferact/Qwen3.8-Flash-Next-NVFP4
container: vllm-node-qwen
cluster_only: true

mods:
  - mods/qwen38-flash-next-stability

env:
  TZ: Asia/Seoul
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

build_args:
  - --qwen38-flash-next

defaults:
  port: 54351
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 1000000
  max_num_seqs: 1
  max_num_batched_tokens: 1024

command: |
  vllm serve Inferact/Qwen3.8-Flash-Next-NVFP4 \
    --served-model-name qwen3.8-flash-next \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --mamba-block-size 1024 \
    --enforce-eager \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --load-format instanttensor \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}' \
    --hf-overrides '{{"text_config": {{"rope_parameters": {{"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}}}}' \
    --max-model-len {max_model_len}
